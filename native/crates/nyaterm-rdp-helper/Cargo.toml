[package]
name = "nyaterm-rdp-helper"
version = "1.2.2"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nyaterm-rdp-helper"
path = "src/main.rs"

[dependencies]
nyaterm-remote-desktop = { package = "nyaterm-native-protocol", path = "../nyaterm-native-protocol" }
anyhow.workspace = true
arboard = { version = "3", features = ["wayland-data-control"] }
dirs.workspace = true
hostname = "0.4.1"
ironrdp-client = { version = "0.1.0", features = ["clipboard", "rdpdr", "rustls", "smartcard", "sound"] }
ironrdp-cfg.workspace = true
ironrdp-connector = "0.12"
ironrdp-cliprdr = "0.9"
ironrdp-core = { version = "0.3", features = ["alloc"] }
ironrdp-input.workspace = true
ironrdp-pdu = "0.11"
ironrdp-rdpdr-native.workspace = true
# Only for the certificate-validation policy types named by `ConfigBuilder`.
# ironrdp-client does not re-export them.
ironrdp-tls = { version = "0.3", default-features = false }
rustls.workspace = true
sha2.workspace = true
smallvec = "1.15"
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
x509-cert = { version = "0.2", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
# ironrdp-rdpsnd-native calls IMMDevice::Activate but does not enable the two
# windows features that declare it. Feature unification from this crate makes
# the method available without patching the upstream source.
windows = { version = "0.62", features = [
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[dev-dependencies]
ironrdp-client = { version = "0.1.0", features = ["__test"] }
tempfile.workspace = true
ironrdp-svc = "0.10"
