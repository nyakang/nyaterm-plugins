[package]
name = "nyaterm-x11-helper"
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nyaterm-native-protocol = { path = "../nyaterm-native-protocol" }

[target.'cfg(windows)'.dependencies]
tempfile.workspace = true
zeroize.workspace = true
getrandom = "0.3"
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
