name: Sign approved extension v2
on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Reviewed extension ID
        required: true
      version:
        description: Reviewed candidate version
        required: true
permissions:
  contents: read
concurrency:
  group: extension-signing-v2
  cancel-in-progress: false
jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: plugin-signing
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run validate
      - name: Require an explicitly reviewed platform revision
        env:
          VALIDATOR_REF: ${{ vars.NYATERM_VALIDATOR_REF }}
        run: test "${#VALIDATOR_REF}" -eq 40 && [[ "$VALIDATOR_REF" =~ ^[0-9a-f]+$ ]]
      - uses: actions/checkout@v4
        with:
          repository: nyakang/nyaterm
          ref: ${{ vars.NYATERM_VALIDATOR_REF }}
          path: work/platform
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - run: cargo build --locked --manifest-path work/platform/Cargo.toml -p nyaterm-plugin-host --bin nyaterm-plugin-tool
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign reviewed immutable archive
        env:
          PLUGIN_ID: ${{ inputs.plugin }}
          PLUGIN_VERSION: ${{ inputs.version }}
          NYATERM_STORE_SIGNING_KEY: ${{ secrets.NYATERM_STORE_SIGNING_KEY }}
          NYATERM_EXTENSION_PUBLIC_KEY: ${{ vars.NYATERM_EXTENSION_PUBLIC_KEY }}
          NYATERM_PLUGIN_CLI: ${{ github.workspace }}/work/platform/target/debug/nyaterm-plugin-tool
        run: |
          umask 077
          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$NYATERM_STORE_SIGNING_KEY" > "$KEY_FILE"
          export NYATERM_STORE_KEY_FILE="$KEY_FILE"
          node tooling/v2/sign.mjs "$PLUGIN_ID" "$PLUGIN_VERSION" work/signed
      - name: Publish immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(node -p "JSON.parse(require('fs').readFileSync('work/signed/release.json')).tag")
          ASSET=$(node -p "JSON.parse(require('fs').readFileSync('work/signed/release.json')).asset")
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "Reviewed NyaTerm extension v2."
          fi
          gh release upload "$TAG" "work/signed/$ASSET" "work/signed/$ASSET.minisig"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-catalog-update
          path: |
            extensions-v2/
            public/v2/plugins.json
            work/signed/release.json
      - name: Open reviewed catalog pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="catalog-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -- extensions-v2 public/v2/plugins.json
          git commit -m 'chore(store): publish reviewed v2 extension catalog'
          git push origin "$BRANCH"
          printf '%s\n' 'Publishes the reviewed extension archive signed by the protected environment. Validate the generated catalog and immutable release assets before merging.' > work/catalog-pr.md
          gh pr create --base main --head "$BRANCH" --title 'chore(store): publish reviewed v2 extension catalog' --body-file work/catalog-pr.md
