name: X11 runtime validation
on:
  push:
    branches: [feat/x11-runtime]
    paths: ['native/**', '.github/workflows/x11-check.yml']
  pull_request:
    paths: ['native/crates/nyaterm-x11-helper/**', 'native/scripts/release/*x11*', '.github/workflows/x11-check.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      host_version:
        type: string
        default: ">=2.0.8, <3"
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      HOST_VERSION: ${{ inputs.host_version || '>=2.0.8, <3' }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.99.1 }
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - uses: actions/cache/restore@v4
        id: vcxsrv-cache
        with:
          path: native/target/x11-source
          key: vcxsrv-msvc-v1-${{ github.sha }}
          restore-keys: vcxsrv-msvc-v1-
      - name: Install upstream build tools
        run: |
          choco install nasm strawberryperl jom gperf -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force target | Out-Null
          Invoke-WebRequest https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip -OutFile target/winflexbison.zip
          if ((Get-FileHash target/winflexbison.zip -Algorithm SHA256).Hash -ne '8d324b62be33604b2c45ad1dd34ab93d722534448f55a16ca7292de32b6ac135') { throw 'winflexbison digest mismatch' }
          Expand-Archive target/winflexbison.zip target/winflexbison -Force
          (Resolve-Path target/winflexbison).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          python -m pip install lxml==6.0.2 Mako==1.3.10
      - name: Build, test and stage component
        shell: pwsh
        run: |
          $env:PATH += ';C:\Program Files\NASM;C:\Strawberry\perl\bin;C:\Strawberry\c\bin;C:\Program Files\Git\usr\bin'
          cargo test --locked -p nyaterm-native-protocol -p nyaterm-x11-helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --target x86_64-pc-windows-msvc -p nyaterm-x11-helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release/components.py package --component x11 --target x86_64-pc-windows-msvc --runtime windows-msvc --host-version "$env:HOST_VERSION" --archive target/x11-component.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import zipfile; zipfile.ZipFile('target/x11-component.zip').extractall('target/x11-smoke')"
          python scripts/release/verify_x11.py target/x11-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache/save@v4
        if: always() && steps.vcxsrv-cache.outputs.cache-hit != 'true'
        with:
          path: native/target/x11-source
          key: vcxsrv-msvc-v1-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-x11-x86_64-pc-windows-msvc
          path: native/target/x11-component.zip
