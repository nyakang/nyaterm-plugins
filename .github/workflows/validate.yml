name: Validate extension store v2
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run validate
      - name: Check reviewed validator revision
        if: vars.NYATERM_VALIDATOR_REF != ''
        env:
          VALIDATOR_REF: ${{ vars.NYATERM_VALIDATOR_REF }}
        run: test "${#VALIDATOR_REF}" -eq 40 && [[ "$VALIDATOR_REF" =~ ^[0-9a-f]+$ ]]
      - uses: actions/checkout@v4
        if: vars.NYATERM_VALIDATOR_REF != ''
        with:
          repository: nyakang/nyaterm
          ref: ${{ vars.NYATERM_VALIDATOR_REF }}
          path: work/platform
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        if: vars.NYATERM_VALIDATOR_REF != ''
        with:
          toolchain: 1.99.1
      - name: Build reviewed inspector
        if: vars.NYATERM_VALIDATOR_REF != ''
        run: cargo build --locked --manifest-path work/platform/Cargo.toml -p nyaterm-plugin-host --bin nyaterm-plugin-tool
      - name: Cross-repository contract and package validation
        if: vars.NYATERM_VALIDATOR_REF != ''
        env:
          NYATERM_PLUGIN_CLI: ${{ github.workspace }}/work/platform/target/debug/nyaterm-plugin-tool
          NYATERM_EXTENSION_PUBLIC_KEY: ${{ vars.NYATERM_EXTENSION_PUBLIC_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          npm test
          npm run validate -- --packages
